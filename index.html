<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdminLTE Loc</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:#f4f6f9;color:#212529}.sidebar{position:fixed;inset:0 auto 0 0;width:260px;background:#1d2730;color:white}.logo{height:60px;padding:20px;font-weight:bold;border-bottom:1px solid #34404a}.logo span{color:#20c997}.menu{padding:25px 15px}.menu-item{padding:13px 15px;margin:5px 0;border-radius:5px;cursor:pointer}.menu-item:hover,.active{background:#343f48}.main{margin-left:260px;min-height:100vh}.topbar{height:60px;background:white;border-bottom:1px solid #ddd;padding:0 25px;display:flex;align-items:center}.menu-button{border:0;background:none;font-size:22px;cursor:pointer}.top-right{margin-left:auto}.content{padding:30px}.page-title{font-size:32px;font-weight:400}.breadcrumb{margin-bottom:20px;color:#777}.breadcrumb span{color:#007bff}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}.search{padding:11px;border:1px solid #ddd;border-radius:5px;width:280px;margin-bottom:15px}.btn{padding:10px 15px;border:0;border-radius:5px;cursor:pointer}.primary{background:#007bff;color:white}.warning{background:#ffc107}.danger{background:#dc3545;color:white}.secondary{background:#6c757d;color:white}.table-container{background:white;border-radius:7px;box-shadow:0 2px 8px #0001;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:15px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}.actions{display:flex;gap:8px;flex-wrap:wrap}.badge{background:#e8ddff;color:#5632a8;padding:6px 10px;border-radius:5px}.empty{text-align:center;padding:40px;color:#777}.footer{margin-top:50px;padding:20px 30px;border-top:1px solid #ddd;color:#777;display:flex;justify-content:space-between}.category-image{width:48px;height:48px;object-fit:contain;border-radius:5px;background:#fff;border:1px solid #eee}.modal-bg{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:10}.modal{background:white;width:480px;max-width:92%;padding:25px;border-radius:8px;max-height:90vh;overflow:auto}.modal h2{margin-bottom:20px}.group{margin-bottom:15px}.group label{display:block;margin-bottom:6px;font-weight:bold}.group input,.group select{width:100%;padding:11px;border:1px solid #ccc;border-radius:5px}.preview{width:90px;height:90px;object-fit:contain;display:none;margin-top:10px;border:1px solid #ddd;border-radius:6px}.modal-buttons{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.dark{background:#121820;color:#eee}.dark .topbar,.dark .table-container,.dark .modal{background:#1d2730;color:#eee}.dark th,.dark td{border-color:#34404a}.dark .search,.dark input,.dark select{background:#26323c;color:#fff;border-color:#45525d}@media(max-width:700px){.sidebar{left:-260px;z-index:5}.sidebar.open{left:0}.main{margin-left:0}.toolbar{flex-direction:column;align-items:stretch}.search{width:100%}.footer{flex-direction:column;gap:10px}.content{padding:18px}.page-title{font-size:25px}}
</style></head><body>
<aside class="sidebar" id="sidebar"><div class="logo">AdminLTE Loc <span>AdminLTE 4</span></div><div class="menu"><div class="menu-item active" id="catMenu" onclick="showPage('categorias')">📁 Categorias　›</div><div class="menu-item" id="prodMenu" onclick="showPage('produtos')">📦 Produtos　›</div></div><div style="position:absolute;bottom:20px;width:100%;padding:15px;border-top:1px solid #34404a">👤 Usuário: Alexander Perea<br><br><span onclick="alert('Sessão encerrada.')" style="cursor:pointer">🚪 Sair</span></div></aside>
<main class="main"><header class="topbar"><button class="menu-button" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div class="top-right">🔍　🔔　<span onclick="toggleDark()" style="cursor:pointer">🌙</span>　👤 Alexander Perea</div></header><section class="content" id="app"></section><footer class="footer"><span><b>Copyright © 2014-2026</b> <span style="color:#07f">AdminLTE Loc</span>. All rights reserved.</span><span>Anything you want</span></footer></main>
<div class="modal-bg" id="modal"><div class="modal"><h2 id="modalTitle"></h2><div id="form"></div><div class="modal-buttons"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="save()">Salvar</button></div></div></div>
<script>
let categorias=JSON.parse(localStorage.getItem('categorias')||'null')||[{id:1,nome:'Vodka',imagem:''},{id:2,nome:'Refrigerantes',imagem:''}];
let produtos=JSON.parse(localStorage.getItem('produtos')||'null')||[{id:1,nome:'Smirnoff 998ml',preco:89.90,categoria:1},{id:2,nome:'Absolut 750ml',preco:74.90,categoria:1}];let tipo='',editId=null,imagemCategoriaTemp='';
function persist(){localStorage.setItem('categorias',JSON.stringify(categorias));localStorage.setItem('produtos',JSON.stringify(produtos))}
function showPage(p){document.getElementById('catMenu').classList.toggle('active',p==='categorias');document.getElementById('prodMenu').classList.toggle('active',p==='produtos');p==='categorias'?renderCat():renderProd()}
function renderCat(q=''){let list=categorias.filter(x=>x.nome.toLowerCase().includes(q.toLowerCase()));document.getElementById('app').innerHTML=`<div class="breadcrumb"><span>Início</span> / Categorias</div><div class="toolbar"><h1 class="page-title">Lista de categoria</h1><button class="btn primary" onclick="openCat()">＋ Nova categoria</button></div><input class="search" placeholder="Pesquisar categoria..." oninput="renderCat(this.value)"><div class="table-container"><table><thead><tr><th>#</th><th>Nome</th><th>Imagem</th><th>Ações</th></tr></thead><tbody>${list.length?list.map(x=>`<tr><td>${x.id}</td><td>${escapeHtml(x.nome)}</td><td>${x.imagem?`<img class="category-image" src="${x.imagem}" alt="${escapeHtml(x.nome)}">`:'<span style="color:#888">Sem imagem</span>'}</td><td><div class="actions"><button class="btn warning" onclick="openCat(${x.id})">✏️ Editar</button><button class="btn danger" onclick="delCat(${x.id})">🗑️ Excluir</button></div></td></tr>`).join(''):`<tr><td colspan="4" class="empty">Nenhuma categoria encontrada.</td></tr>`}</tbody></table></div>`}
function renderProd(q=''){let list=produtos.filter(x=>x.nome.toLowerCase().includes(q.toLowerCase()));document.getElementById('app').innerHTML=`<div class="breadcrumb"><span>Início</span> / Produtos</div><div class="toolbar"><h1 class="page-title">Lista de Produto</h1><button class="btn primary" onclick="openProd()">＋ Novo produto</button></div><input class="search" placeholder="Pesquisar produto..." oninput="renderProd(this.value)"><div class="table-container"><table><thead><tr><th>#</th><th>Nome</th><th>Preço</th><th>Categoria</th><th>Ações</th></tr></thead><tbody>${list.length?list.map(x=>{let c=categorias.find(c=>c.id==x.categoria);return `<tr><td>${x.id}</td><td>${escapeHtml(x.nome)}</td><td>R$ ${Number(x.preco).toFixed(2).replace('.',',')}</td><td><span class="badge">${c?escapeHtml(c.nome):'Sem categoria'}</span></td><td><div class="actions"><button class="btn warning" onclick="openProd(${x.id})">✏️ Editar</button><button class="btn danger" onclick="delProd(${x.id})">🗑️ Excluir</button></div></td></tr>`}).join(''):`<tr><td colspan="5" class="empty">Nenhum produto encontrado.</td></tr>`}</tbody></table></div>`}
function openCat(id=null){tipo='cat';editId=id;let x=id?categorias.find(c=>c.id==id):null;imagemCategoriaTemp=x?.imagem||'';document.getElementById('modalTitle').textContent=id?'Editar categoria':'Nova categoria';document.getElementById('form').innerHTML=`<div class="group"><label>Nome da categoria</label><input id="nome" value="${escapeHtml(x?.nome||'')}" placeholder="Ex.: Vodka"></div><div class="group"><label>Imagem da categoria</label><input id="imagemArquivo" type="file" accept="image/*" onchange="previewImagem(event)"><small>Escolha uma imagem do celular ou computador.</small><img id="preview" class="preview" alt="Prévia da imagem" ${imagemCategoriaTemp?'src="'+imagemCategoriaTemp+'" style="display:block"':''}></div>`;document.getElementById('modal').style.display='flex'}
function previewImagem(event){let file=event.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return alert('Selecione um arquivo de imagem.');if(file.size>2*1024*1024)return alert('A imagem deve ter até 2 MB.');let reader=new FileReader();reader.onload=e=>{imagemCategoriaTemp=e.target.result;let img=document.getElementById('preview');img.src=imagemCategoriaTemp;img.style.display='block'};reader.readAsDataURL(file)}
function openProd(id=null){tipo='prod';editId=id;let x=id?produtos.find(p=>p.id==id):null;document.getElementById('modalTitle').textContent=id?'Editar produto':'Novo produto';document.getElementById('form').innerHTML=`<div class="group"><label>Nome</label><input id="nome" value="${escapeHtml(x?.nome||'')}"></div><div class="group"><label>Preço</label><input id="preco" type="number" step="0.01" value="${x?.preco??''}"></div><div class="group"><label>Categoria</label><select id="categoria">${categorias.map(c=>`<option value="${c.id}" ${x?.categoria==c.id?'selected':''}>${escapeHtml(c.nome)}</option>`).join('')}</select></div>`;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none';editId=null;imagemCategoriaTemp=''}
function save(){if(tipo==='cat'){let nome=document.getElementById('nome').value.trim();if(!nome)return alert('Digite o nome da categoria.');if(editId){let x=categorias.find(c=>c.id==editId);x.nome=nome;x.imagem=imagemCategoriaTemp}else categorias.push({id:Math.max(0,...categorias.map(x=>x.id))+1,nome,imagem:imagemCategoriaTemp});persist();closeModal();renderCat()}else{let nome=document.getElementById('nome').value.trim(),preco=parseFloat(document.getElementById('preco').value),categoria=Number(document.getElementById('categoria').value);if(!nome||isNaN(preco)||!categoria)return alert('Preencha nome, preço e categoria.');if(editId){let x=produtos.find(p=>p.id==editId);Object.assign(x,{nome,preco,categoria})}else produtos.push({id:Math.max(0,...produtos.map(x=>x.id))+1,nome,preco,categoria});persist();closeModal();renderProd()}}
function delCat(id){if(produtos.some(p=>p.categoria==id))return alert('Exclua primeiro os produtos desta categoria.');if(confirm('Excluir categoria?')){categorias=categorias.filter(x=>x.id!=id);persist();renderCat()}}function delProd(id){if(confirm('Excluir produto?')){produtos=produtos.filter(x=>x.id!=id);persist();renderProd()}}
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark'))}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(localStorage.getItem('dark')==='true')document.body.classList.add('dark');renderCat();
</script></body></html>
